name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      public_api_url:
        type: string
        default: http://127.0.0.1:8300
      turnstile_site_key:
        type: string
        default: local-test-site-key
      build_target:
        type: string
        default: local
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_target || 'local' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  CI: 'true'
  PYTHONUNBUFFERED: '1'
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
          backend/.venv/bin/pip check
      - run: bash scripts/ci-mongo-replica-set.sh start
      - run: .venv/bin/python -m pytest tests -q
        working-directory: backend
      - name: Lint workflow and shell syntax
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
          bash -n scripts/ci-mongo-replica-set.sh
      - if: always()
        run: bash scripts/ci-mongo-replica-set.sh stop
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_TARGET: ${{ inputs.build_target || 'local' }}
      REACT_APP_BACKEND_URL: ${{ inputs.public_api_url || 'http://127.0.0.1:8300' }}
      REACT_APP_TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key || 'local-test-site-key' }}
      REACT_APP_TURNSTILE_MODE: live
      GENERATE_SOURCEMAP: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm install --global yarn@1.22.22
      - run: yarn --cwd frontend install --frozen-lockfile
      - run: yarn --cwd frontend test --watchAll=false --runInBand
        env:
          REACT_APP_TURNSTILE_MODE: fake
      - run: yarn --cwd frontend build
      - run: python scripts/check-release-config.py --target "$BUILD_TARGET" --build frontend/build --sha "$GITHUB_SHA"
      - run: python scripts/check-static-artifact.py --build frontend/build --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-release
          path: frontend/build
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_PUBLIC_API_URL: ${{ inputs.public_api_url || 'http://127.0.0.1:8300' }}
      BUILD_TARGET: ${{ inputs.build_target || 'local' }}
      REACT_APP_BACKEND_URL: ${{ inputs.public_api_url || 'http://127.0.0.1:8300' }}
      REACT_APP_TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key || 'local-test-site-key' }}
      REACT_APP_TURNSTILE_MODE: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
          npm install --global yarn@1.22.22
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend playwright install --with-deps chromium --only-shell
      - run: bash scripts/ci-mongo-replica-set.sh start
      - run: yarn --cwd frontend test:e2e
        env:
          E2E_FRONTEND_MODE: dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-release
          path: frontend/build
      - run: python scripts/check-release-config.py --target "$BUILD_TARGET" --build frontend/build --sha "$GITHUB_SHA" --verify
      - run: yarn --cwd frontend test:e2e intake.spec.js newsletter.spec.js
        env:
          E2E_FRONTEND_MODE: build
      - if: always()
        run: bash scripts/ci-mongo-replica-set.sh stop
